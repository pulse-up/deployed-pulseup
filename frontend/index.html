<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseUp | CPUT Campus Clinic</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f4fafb; }
      .startup-first-paint { position: fixed; inset: 0; display: grid; min-height: 100vh; min-height: 100dvh; place-items: center; background: radial-gradient(circle at 50% 43%, #fff 0 14%, transparent 45%), linear-gradient(145deg, #edf9f8, #f8fbfd 48%, #edf5fa); font-family: Arial, sans-serif; }
      .startup-first-paint__content { width: min(72vw, 280px); text-align: center; animation: first-paint-enter .5s ease-out both; }
      .startup-first-paint__spinner { width: 112px; height: 112px; margin: 0 auto 25px; border: 2px solid rgb(6 74 126 / 10%); border-top-color: #16a6a1; border-right-color: rgb(22 166 161 / 45%); border-radius: 50%; box-shadow: 0 0 32px rgb(22 166 161 / 12%); animation: first-paint-spin 1.4s linear infinite; }
      .startup-first-paint__percent { margin: 0 0 20px; color: #032c49; font-size: 3.5rem; font-weight: 750; letter-spacing: -.06em; line-height: 1; }
      .startup-first-paint__percent span { margin-left: 5px; color: #16a6a1; font-size: 1rem; vertical-align: top; }
      .startup-first-paint__bar { height: 7px; overflow: hidden; border-radius: 999px; background: rgb(6 74 126 / 9%); }
      .startup-first-paint__bar::after { display: block; width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #064a7e, #16a6a1); content: ''; animation: first-paint-load 1.25s ease-in-out infinite; }
      @keyframes first-paint-enter { from { opacity: 0; transform: translateY(10px); } }
      @keyframes first-paint-spin { to { transform: rotate(360deg); } }
      @keyframes first-paint-load { from { transform: translateX(-110%); } to { transform: translateX(245%); } }
      @media (prefers-reduced-motion: reduce) { .startup-first-paint * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="startup-first-paint" aria-label="Website is starting">
        <section class="startup-first-paint__content">
          <div class="startup-first-paint__spinner" aria-hidden="true"></div>
          <p class="startup-first-paint__percent">0<span>%</span></p>
          <div class="startup-first-paint__bar" aria-hidden="true"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
