# Render production profile. Supply every secret through Render environment variables.
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never

spring.jpa.hibernate.ddl-auto=${PULSEUP_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=${PULSEUP_DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=120000

logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
