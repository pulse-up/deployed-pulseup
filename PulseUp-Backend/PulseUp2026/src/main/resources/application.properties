spring.application.name=PulseUp2026
server.port=${PORT:8080}

spring.datasource.url=${PULSEUP_DB_URL:jdbc:mysql://localhost:3306/pulseup?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Africa/Johannesburg}
spring.datasource.username=${PULSEUP_DB_USERNAME:root}
spring.datasource.password=${PULSEUP_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${PULSEUP_DDL_AUTO:update}
spring.jpa.show-sql=${PULSEUP_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

pulseup.frontend.origins=${PULSEUP_FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
pulseup.bootstrap-admin.enabled=${PULSEUP_BOOTSTRAP_ADMIN_ENABLED:false}
pulseup.bootstrap-admin.email=${PULSEUP_BOOTSTRAP_ADMIN_EMAIL:}
pulseup.bootstrap-admin.password=${PULSEUP_BOOTSTRAP_ADMIN_PASSWORD:}
pulseup.bootstrap-admin.first-name=${PULSEUP_BOOTSTRAP_ADMIN_FIRST_NAME:}
pulseup.bootstrap-admin.last-name=${PULSEUP_BOOTSTRAP_ADMIN_LAST_NAME:}
pulseup.bootstrap-admin.phone-number=${PULSEUP_BOOTSTRAP_ADMIN_PHONE_NUMBER:}
pulseup.bootstrap-admin.admin-number=${PULSEUP_BOOTSTRAP_ADMIN_NUMBER:}
pulseup.bootstrap-admin.department=${PULSEUP_BOOTSTRAP_ADMIN_DEPARTMENT:System Administration}

security.jwt.secret=${PULSEUP_JWT_SECRET}
security.jwt.issuer=pulseup-api
security.jwt.expiration-seconds=3600
